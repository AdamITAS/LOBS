<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b6fed">
<title>LOBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f9;--bg-soft:#f7f9fd;--fg:#16233a;--card:#fff;--ac:#3b6fed;--ac-deep:#2451d4;--ac-soft:#e9effe;--ac2:#12a06b;--ac2-soft:#e2f6ec;--on:#fff;--mut:#64748f;--bd:#dfe6f2;--bd-strong:#c9d4e8;--danger:#d43b45;--r:16px;--r-sm:12px;--r-lg:22px;--fs:18px;--ff:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--fd:'Plus Jakarta Sans','Inter',system-ui,sans-serif;--grad:linear-gradient(135deg,#3b6fed,#7c4dff);--sh-1:0 1px 2px rgba(22,35,58,.05),0 6px 20px rgba(22,35,58,.08);--sh-2:0 8px 20px rgba(22,35,58,.12),0 24px 60px rgba(22,35,58,.16)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;color:var(--fg);font:var(--fs)/1.55 var(--ff);-webkit-font-smoothing:antialiased;background:radial-gradient(900px 520px at 8% -8%,#dce8ff 0%,transparent 55%),radial-gradient(820px 480px at 108% 4%,#e9e0ff 0%,transparent 52%),radial-gradient(760px 520px at 50% 118%,#d8f4e6 0%,transparent 55%),var(--bg);background-attachment:fixed}
h1,h2{font-family:var(--fd)}h2{margin:0 0 10px;font-size:1.28em;letter-spacing:-.01em}
p{margin:8px 0}small{display:block;font-weight:400;opacity:.85}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px;border-radius:6px}
::selection{background:var(--ac);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#c3cddf;border-radius:99px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}

/* ---------- header ---------- */
.bar{position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px clamp(14px,3vw,26px);background:rgba(255,255,255,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-size:1.1em;font-weight:800;letter-spacing:-.01em}
.brand-logo{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:var(--grad);color:#fff;font-size:1.15em;box-shadow:0 6px 16px rgba(59,110,245,.35);animation:floaty 3.6s ease-in-out infinite}
main{max-width:1180px;margin:0 auto;padding:clamp(16px,3vw,28px) clamp(14px,3vw,26px) 64px}

/* ---------- card / hero / home ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);padding:clamp(16px,2.4vw,24px);box-shadow:var(--sh-1);transition:box-shadow .25s ease,transform .25s ease,border-color .25s ease}
#app .card,#app .home,#app .adm,#app .tv,#app .hero{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both}
#app .home>.card:nth-child(1){animation-delay:.03s}
#app .home>.card:nth-child(2){animation-delay:.11s}
#app .home>.card:nth-child(3){animation-delay:.19s}
.hero{max-width:660px;margin:6px auto 20px}
.hero h1{font-size:clamp(1.7em,5vw,2.4em);margin:12px 0 4px;letter-spacing:-.02em}
.hero p{margin:0}
.hero-ico{display:inline-grid;place-items:center;width:78px;height:78px;border-radius:24px;background:var(--grad);color:#fff;font-size:2.2em;box-shadow:0 14px 34px rgba(59,110,245,.4);animation:floaty 3.6s ease-in-out infinite}
.home{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:18px}
.pick{position:relative;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start}
.pick:hover{transform:translateY(-5px);border-color:transparent;box-shadow:0 0 0 3px var(--ac-soft),var(--sh-2)}
.pick:active{transform:translateY(-1px) scale(.99)}
.pick-ico{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--ac-soft);font-size:1.6em;margin-bottom:10px}
.pick h2{margin:0 0 4px}
.pick p{margin:0;color:var(--mut);font-size:.92em}
.pick-cta{color:var(--ac);font-weight:700;margin-top:10px}
ul.check{list-style:none;padding:0;margin:6px 0}
ul.check li{position:relative;padding-left:28px;margin:9px 0}
ul.check li::before{content:"✓";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--ac2-soft);color:#0d7a4f;font-size:.72em;font-weight:800;display:grid;place-items:center;margin-top:3px}
.adm{display:grid;gap:16px;align-items:start}
.col{display:grid;gap:16px;align-content:start}

/* ---------- bottoni ---------- */
.b{min-height:54px;padding:0 22px;border:0;border-radius:var(--r);background:var(--ac);color:#fff;font:700 1em var(--ff);cursor:pointer;touch-action:manipulation;transition:transform .15s ease,box-shadow .2s ease,filter .2s ease,background .2s ease,border-color .2s ease;box-shadow:0 4px 14px rgba(59,110,245,.28)}
.b:hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 8px 22px rgba(59,110,245,.35)}
.b:active{transform:translateY(0) scale(.98)}
.b.alt{background:var(--card);color:var(--fg);border:2px solid var(--bd-strong);box-shadow:none}
.b.alt:hover{border-color:var(--ac);color:var(--ac);transform:translateY(-2px);box-shadow:var(--sh-1);filter:none}
.b.sm{min-height:44px;padding:0 14px;font-size:.85em;border-radius:var(--r-sm)}
.b.on{background:var(--ac2);box-shadow:0 4px 14px rgba(18,160,107,.3)}
.b.on:hover{filter:brightness(1.06)}
.b.big{font-size:1.3em;min-height:88px;width:100%;border-radius:var(--r-lg);background:var(--grad);box-shadow:0 10px 26px rgba(59,110,245,.35)}
.b.block{display:block;width:100%;text-align:left;margin:8px 0;padding:14px 18px}
.b.block:hover{transform:translateX(4px);filter:none}
.b.block small{display:block;font-weight:500;opacity:.75;font-size:.78em;margin-top:2px}
.b.block:not(.alt){background:var(--grad);box-shadow:0 6px 18px rgba(59,110,245,.3)}
.b.danger:hover{border-color:var(--danger);color:var(--danger);box-shadow:0 6px 16px rgba(212,59,69,.2)}
.b[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none;filter:none}
.pulse{animation:pulseG 1.9s ease-in-out infinite}

/* ---------- input ---------- */
input,select{width:100%;min-height:56px;margin:6px 0;padding:0 16px;border:2px solid var(--bd-strong);border-radius:var(--r);background:var(--bg-soft);color:var(--fg);font:inherit;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus{outline:0;border-color:var(--ac);background:#fff;box-shadow:0 0 0 4px var(--ac-soft)}
.mut{color:var(--mut)}.center{text-align:center}
.err{color:var(--danger);font-weight:700;min-height:1.4em}
.shake{animation:shake .5s ease}
.ok{color:var(--ac2);font-weight:700}

/* ---------- codice / tag / righe ---------- */
.code{font-family:var(--fd);font-size:clamp(2.6rem,9vw,4.2rem);font-weight:800;letter-spacing:.2em;color:var(--ac);margin:6px 0}
.code span{display:inline-block;animation:popIn .55s cubic-bezier(.2,.8,.3,1.35) both}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:99px;background:var(--ac-soft);color:var(--ac-deep);font-weight:700;font-size:.8em;vertical-align:middle}
.tag.st.lobby{background:#eef1f7;color:var(--mut)}
.tag.st.playing{background:var(--ac2-soft);color:#0d7a4f}
.tag.st.playing::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.tag.st.ended{background:#f6f0e3;color:#8a6d1a}
.tag.live{background:var(--ac2-soft);color:#0d7a4f}
.tag.demo{background:#f1f3f8;color:var(--mut);font-size:.7em;padding:2px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--bd)}
.dot2{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;background:#c3ccdb;flex:none}
.dot2.on{background:#1fbf6a;animation:ring 1.8s infinite}
.count{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 9px;border-radius:99px;background:var(--ac-soft);color:var(--ac-deep);font-size:.78em;font-weight:800;vertical-align:middle;margin-left:6px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chead h2{margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.gi{font-size:1.15em;margin-right:4px}
.gicon{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:var(--ac-soft);font-size:1.5em;flex:none}
.ghead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.ghead h2{margin:0}
.empty{background:var(--bg-soft);border:1px dashed var(--bd-strong);border-radius:var(--r);padding:14px 16px}
.winlbl{font-size:1.2em}.biglbl{font-size:1.05em}
.poschip{display:inline-block;padding:6px 14px;border-radius:99px;background:var(--ac-soft);color:var(--ac-deep);font-weight:700;margin-top:6px}

/* ---------- classifica ---------- */
.lb{list-style:none;margin:10px 0 0;padding:0}
.lb li{position:relative;display:flex;gap:12px;align-items:center;padding:12px 14px;margin:8px 0;border-radius:var(--r);border:2px solid var(--bd);background:linear-gradient(90deg,var(--ac-soft) var(--w,0%),transparent var(--w,0%));animation:fadeUp .45s ease both;animation-delay:calc(var(--i,0)*70ms)}
.lb li b{min-width:3ch;font-family:var(--fd);font-size:1.05em}
.lb li span{flex:1;min-width:0;overflow-wrap:anywhere}
.lb li em{font-style:normal;font-weight:800;font-family:var(--fd)}
.lb li small{font-weight:400;opacity:.75;font-size:.78em;margin-top:2px}
.lb li:first-child{border-color:var(--ac);box-shadow:0 4px 14px rgba(59,110,245,.15)}
.lb li.me{background:linear-gradient(90deg,rgba(255,255,255,.28) var(--w,0%),rgba(255,255,255,.06) var(--w,0%)),var(--ac);color:#fff;border-color:var(--ac)}
details{padding:10px 0;border-bottom:1px dashed var(--bd)}
summary{cursor:pointer;font-weight:700;padding:6px 0;font-family:var(--fd)}
summary::marker{color:var(--ac)}

/* ---------- stati di attesa / avvisi ---------- */
.dots{display:inline-flex;gap:7px;margin:14px 0 2px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--ac);animation:dotB 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s;background:#7c4dff}
.dots i:nth-child(3){animation-delay:.3s;background:var(--ac2)}
.big-ico{font-size:3em;line-height:1;margin-bottom:8px;display:inline-block;animation:popIn .55s cubic-bezier(.2,.8,.3,1.4) both}
.big-ico.hour{animation:popIn .55s both,tilt 2.6s ease-in-out .55s infinite}
.big-ico.trophy{filter:drop-shadow(0 10px 18px rgba(185,125,10,.35));animation:popIn .6s both,floaty 3s ease-in-out .6s infinite}
.prog{height:12px;border-radius:99px;background:var(--ac-soft);overflow:hidden;margin:10px 0 8px}
.prog i{display:block;height:100%;border-radius:inherit;background:var(--grad);transition:width .7s cubic-bezier(.2,.7,.3,1);position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%);background-size:18px 18px;animation:stripes .9s linear infinite}
.banner-ok{margin-top:12px;padding:12px 16px;border-radius:var(--r);background:var(--ac2-soft);color:#0d7a4f;font-weight:700;animation:popIn .5s both}
.exit-reveal{opacity:0;transform:translateY(10px);animation:reveal .6s cubic-bezier(.2,.7,.3,1) 1.6s forwards}
/* ---------- giochi ---------- */
.pad{display:grid;place-items:center;min-height:52vh;border-radius:var(--r-lg);color:#fff;font-size:clamp(1.4em,4.5vw,2em);font-weight:800;text-align:center;padding:24px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:inset 0 10px 30px rgba(255,255,255,.14),inset 0 -14px 34px rgba(0,0,0,.22);transition:background-color .25s ease,transform .12s ease;animation:padBreathe 2.6s ease-in-out infinite}
.pad:active{transform:scale(.985)}
.field{position:relative;height:min(52vh,460px);min-height:280px;border:2px dashed var(--bd-strong);border-radius:var(--r-lg);overflow:hidden;touch-action:manipulation;background-color:var(--bg-soft);background-image:radial-gradient(var(--bd) 1.5px,transparent 1.5px);background-size:22px 22px}
.dot{position:absolute;width:clamp(64px,14vw,96px);aspect-ratio:1;height:auto;border-radius:50%;border:0;background:var(--ac);cursor:pointer;box-shadow:0 8px 20px rgba(59,110,245,.4),inset 0 6px 12px rgba(255,255,255,.35);animation:dotSpawn .3s cubic-bezier(.2,.8,.3,1.4) both,dotRing 1.6s ease-out .3s infinite}
.dot:active{transform:scale(.9)}
.hud{display:flex;justify-content:space-between;font-weight:700;font-family:var(--fd);background:var(--ac-soft);color:var(--ac-deep);padding:10px 16px;border-radius:14px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{min-height:22vh;border:0;border-radius:var(--r-lg);color:#fff;font:800 1.35em var(--ff);display:grid;place-content:center;gap:4px;cursor:pointer;touch-action:manipulation;text-shadow:0 2px 6px rgba(0,0,0,.25);box-shadow:inset 0 8px 20px rgba(255,255,255,.18),inset 0 -10px 24px rgba(0,0,0,.18),0 6px 16px rgba(22,35,58,.12);transition:transform .15s ease,filter .2s ease,box-shadow .2s ease}
.tile span{font-size:2em}
.tile:active{transform:scale(.95)}
.tile.lit{outline:6px solid var(--fg);transform:scale(1.06);filter:brightness(1.18);box-shadow:0 0 0 10px rgba(59,110,245,.25),0 10px 30px rgba(22,35,58,.25)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;perspective:900px}
.card2{aspect-ratio:1;min-height:80px;font-size:2.2em;border:2px solid var(--bd-strong);border-radius:var(--r);background:var(--bg-soft);color:var(--fg);cursor:pointer;transition:transform .45s ease,background .25s ease,border-color .25s ease;box-shadow:var(--sh-1)}
.card2:hover{border-color:var(--ac)}
.card2.up{background:var(--ac2);color:#fff;border-color:var(--ac2);transform:rotateY(360deg) scale(1.05);box-shadow:0 10px 24px rgba(18,160,107,.35)}
.tv{max-width:1000px;margin:0 auto}
.tv .code{font-size:clamp(4rem,16vw,9rem);letter-spacing:.12em}
.tv .card{box-shadow:var(--sh-1)}

/* ---------- skeleton di caricamento ---------- */
.boot{display:grid;gap:14px;max-width:560px;margin:0 auto;padding-top:24px}
.skel{border-radius:var(--r-lg);background:linear-gradient(100deg,#e7ecf5 40%,#f4f7fc 50%,#e7ecf5 60%);background-size:200% 100%;animation:shimmer 1.3s infinite}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center;width:min(92vw,480px);pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:#131c30;color:#fff;padding:13px 18px;border-radius:16px;box-shadow:var(--sh-2);font-weight:600;animation:toastIn .4s cubic-bezier(.2,.8,.3,1.25) both;max-width:100%}
.toast .ti{font-size:1.2em;flex:none}
.toast.t-success{box-shadow:0 0 0 2px rgba(18,160,107,.45),var(--sh-2)}
.toast.t-warn{box-shadow:0 0 0 2px rgba(212,59,69,.5),var(--sh-2)}
.toast.out{animation:toastOut .3s ease forwards}

/* ---------- modal ---------- */
.mwrap{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;background:rgba(16,26,46,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .25s ease both}
.mwrap.closing{animation:fadeOut .25s ease forwards}
.mcard{background:#fff;border-radius:24px;max-width:480px;width:100%;padding:26px;box-shadow:var(--sh-2);animation:popIn .4s cubic-bezier(.2,.8,.3,1.3) both;text-align:center;max-height:92dvh;overflow:auto}
.mcard.wide{max-width:min(94vw,640px)}
.mcard h2{margin:4px 0 2px}
.micon{font-size:2.8em;margin-bottom:6px;display:inline-block;animation:floaty 3s ease-in-out infinite}
.mbody{text-align:left;color:var(--mut);margin:10px 0 18px}
.mbody ul{padding-left:20px;margin:8px 0}
.mbody li{margin:8px 0}
.mbody b{color:var(--fg)}
.mcard .b{width:100%}

/* ---------- animazioni ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes reveal{to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
@keyframes pulseG{0%,100%{transform:scale(1);box-shadow:0 10px 26px rgba(59,110,245,.35)}50%{transform:scale(1.025);box-shadow:0 14px 36px rgba(59,110,245,.5)}}
@keyframes blink{50%{opacity:.35}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(31,191,106,.45)}70%{box-shadow:0 0 0 9px rgba(31,191,106,0)}100%{box-shadow:0 0 0 0 rgba(31,191,106,0)}}
@keyframes dotB{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-7px);opacity:1}}
@keyframes stripes{to{background-position:18px 0}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tilt{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.95)}}
@keyframes padBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
@keyframes dotSpawn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes dotRing{0%{box-shadow:0 0 0 0 rgba(59,110,245,.35)}100%{box-shadow:0 0 0 22px rgba(59,110,245,0)}}

/* ---------- responsive ---------- */
@media(max-width:640px){
 :root{--fs:16.5px;--r:14px;--r-lg:18px}
 .code{letter-spacing:.14em}
 .tv .code{letter-spacing:.08em}
 .b.big{min-height:80px;font-size:1.2em}
 .b.block{padding:12px 14px}
 .tile{min-height:19vh}
 .grid4{grid-template-columns:repeat(3,1fr)}
 .row .btnrow{width:100%;justify-content:flex-end;margin-top:4px}
 .pname{min-width:0;flex:1;overflow-wrap:anywhere}
}
@media(min-width:940px){.adm{grid-template-columns:1.05fr .95fr}}
@media(min-width:1400px){main{max-width:1340px}}
@media(max-height:560px) and (orientation:landscape){.field{height:62vh}.pad{min-height:62vh}}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
 .exit-reveal{opacity:1;transform:none;animation:none}
}

/* ---------- footer ---------- */
body{display:flex;flex-direction:column}
main{flex:1;width:100%}
.foot{padding:20px clamp(14px,3vw,26px) max(20px,env(safe-area-inset-bottom));text-align:center;color:var(--mut);font-size:.8em;line-height:1.5;border-top:1px solid var(--bd);background:rgba(255,255,255,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.foot b{color:var(--fg);font-family:var(--fd)}
.foot .sep{display:inline-block;margin:0 6px;opacity:.5}

.notop{color:#c62d32;font-size:.74em;font-weight:600;margin:6px 0 12px;line-height:1.35}
.pwrow{position:relative}.pwrow input{padding-right:48px}.pwrow button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:1.1em;cursor:pointer;padding:8px}
@keyframes finin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.fin{text-align:center;padding:22px 8px;animation:finin .5s ease both}.fin h2{font-size:1.6em;margin:6px 0}.fin-ico{font-size:3.4em}.fin-pts{font-size:1.5em;font-weight:800;color:var(--ac2);margin:4px 0}
.fade-out{opacity:0;transition:opacity .5s ease}.fadein{animation:finin .7s ease both}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 14px}.pod>div{flex:1;max-width:140px;text-align:center;font-weight:700;overflow-wrap:anywhere}

function player(){

 if(running!==null&&!(ok_running_check(s,p))){stop&&stop();stop=null;running=null}else if(running!==null)return;

   let sent=false;for(let k=0;k<3&&!sent;k++){const{error}=await sb.rpc("submit_score",{p_id:me,p_secret:sec,p_round:r,p_pts:pts,p_det:det||""});sent=!error;if(!sent)await wait(800)}

(async()=>{
